<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">

<!-- PWA: поддержка iOS Safari (манифест поддерживается частично, поэтому дублируем мета-тегами) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mood Tracker">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- Регистрация service worker'а -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a1a;
    font-family: 'Inter', sans-serif;
  }

  /* Фиксированный размер контейнера — макет выглядит одинаково на любом телефоне,
     не тянется под ширину/высоту экрана */
  .container {
    width: 100%;
    height: 100vh;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 20px calc(10px + env(safe-area-inset-bottom));
    overflow: hidden;
    position: relative;

    /* Фон-паттерн: seamless-текстура, своя на каждое животное.
       Подставляется скриптом внизу страницы (images/bg-pattern-<animal>.png),
       замощается (repeat), а не растягивается — поэтому важно, чтобы файл был бесшовным. */
    background-repeat: repeat;
    background-position: top left;
    background-color: #cfcfcf; /* фолбэк-цвет, если картинки нет */
  }

  /* ===== CALENDAR ROW ===== */
  .calendar {
    width: 100%;
    flex-shrink: 0;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 10px;
    padding: 0 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.01);
    backdrop-filter: blur(3px);
    overflow: hidden;
  }

  .day {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .day .avatar-wrap {
    position: relative;
    width: 38.57px;
    height: 38.57px;
  }

  .day .avatar-wrap .avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }

  /* декоративная дуга/иконка поверх аватара дня */
  .day .avatar-wrap svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .day .day-label {
    font-size: 8px;
    font-weight: 700;
    color: rgba(0, 0, 0, 0.2);
    letter-spacing: 0.02em;
  }

  /* ===== MAIN AVATAR ===== */
  .avatar-current {
    width: 350px;
    height: 350px;
    flex-shrink: 0;
    border-radius: 50%;
    align-self: center;

    /* Картинка животного (mouse.png / goose.png / capybara.png) подставляется скриптом внизу страницы */
    background-size: cover;
    background-position: center;
    background-color: #b8b8b8; /* фолбэк-цвет, пока JS не отработал / картинки нет */

    box-shadow:
      inset -10px -10px 10px rgba(0, 0, 0, 0.05),
      inset 10px 10px 10px rgba(255, 255, 255, 0.25);
  }

  /* ===== PHASE BAR ===== */
  .phase {
    width: 100%;
    flex-shrink: 0;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 1px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.01);
    backdrop-filter: blur(3px);
    overflow: hidden;
  }

  .phase .segment {
    flex: 1 1 0;
    height: 30px;
    background: rgba(0, 0, 0, 0.1);
  }

  .phase .segment.active {
    background: rgba(0, 0, 0, 0.2);
  }
</style>

  <script>
    // ===== Питомец дня =====
    // Раскладка "едет" по неделям: на нечётных ISO-неделях действует PATTERN_A,
    // на чётных — PATTERN_B. Индекс 0 = понедельник, 6 = воскресенье.
    // Файлы животных лежат в images/: mouse.png, goose.png, capybara.png

    const PATTERN_A = ['mouse', 'goose', 'mouse', 'goose', 'mouse', 'capybara', 'mouse'];   // Пн Вт Ср Чт Пт Сб Вс
    const PATTERN_B = ['goose', 'mouse', 'goose', 'mouse', 'goose', 'capybara', 'capybara']; // Пн Вт Ср Чт Пт Сб Вс

    function getISOWeekNumber(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7; // Пн=1 ... Вс=7
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
    }

    function getTodaysAnimal() {
      const now = new Date();
      const weekNumber = getISOWeekNumber(now);
      const pattern = (weekNumber % 2 === 1) ? PATTERN_A : PATTERN_B;

      const jsDay = now.getDay(); // 0 = Вс, 1 = Пн, ..., 6 = Сб
      const dayIndex = jsDay === 0 ? 6 : jsDay - 1; // переводим в 0 = Пн ... 6 = Вс

      return pattern[dayIndex];
    }

    const animal = getTodaysAnimal();
    document.getElementById('avatarCurrent').style.backgroundImage = `url('images/${animal}.png')`;

    // Фон-паттерн под животное дня: images/bg-pattern-mouse.png / bg-pattern-goose.png / bg-pattern-capybara.png
    document.querySelector('.container').style.backgroundImage = `url('images/bg-pattern-${animal}.png')`;
  </script>

</body>
